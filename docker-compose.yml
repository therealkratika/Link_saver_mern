
services:

  mongo:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      EMAIL_PASS : email_password_here
      EMAIL_USER : email_user_here
      MONGO_URI : mongodb://mongo:27017/link_saver
      JWT_SECRET : your_jwt_secret_here
      BASE_URL : bakend_url_here
      RESEND_API_KEY: resend_api_key_here
      PORT : 5000

    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongo_data: